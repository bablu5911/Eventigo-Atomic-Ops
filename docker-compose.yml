version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atomic-ops-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=atomic_ops_jwt_secret_key_2026_super_secure_spec
      - JWT_REFRESH_SECRET=atomic_ops_refresh_token_secret_key_2026_spec
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atomic-ops-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
